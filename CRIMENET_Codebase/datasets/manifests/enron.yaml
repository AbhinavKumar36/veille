name: Enron Email Corpus
source: Federal Energy Regulatory Commission (FERC) / CMU
classification: Real Public Data
domain: Corporate Fraud & Insider Collusion
adapter: datasets.adapters.enron_adapter.EnronEmailAdapter
target_entities:
  - Person (Email Sender, Recipient, Executive)
  - Organization (Corporate Branch, External Entity)
target_relationships:
  - COMMUNICATES_WITH (Email Exchange)
primary_evaluation: Temporal Communication Graph & Unstructured NLP Extraction
