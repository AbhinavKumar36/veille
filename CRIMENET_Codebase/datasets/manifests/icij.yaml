name: ICIJ Offshore Leaks
source: International Consortium of Investigative Journalists (Panama/Pandora Papers)
classification: Real Public Data
domain: Corporate Crime & Beneficial Ownership
adapter: datasets.adapters.icij_adapter.ICIJOffshoreAdapter
target_entities:
  - Person (Beneficial Director, Shareholder, Nominee)
  - Organization (Offshore Shell Corporation, Intermediary Law Firm)
  - Location (Tax Haven, Registered Jurisdiction)
target_relationships:
  - OWNS (Director / Shareholder of)
  - ASSOCIATED_WITH (Intermediary for)
  - LOCATED_AT (Registered Address)
primary_evaluation: Complex Graph Traversal & Multi-Hop Entity Resolution
