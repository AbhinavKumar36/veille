services:
  backend:
    build:
      context: ./CRIMENET_Codebase/backend
      dockerfile: Dockerfile
    container_name: veille_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://veille:veille_password@postgres:5432/veille_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=veille_graph
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,https://veille-team-void.netlify.app,https://veille-void.netlify.app,*
      - JWT_SECRET=veil-super-secret-jwt-key-2026-production-token
      - ADMIN_EMAIL=admin@veille.gov.in
      - ADMIN_PASSWORD=admin12345
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: veille_postgres
    environment:
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille_password
      POSTGRES_DB: veille_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  neo4j:
    image: neo4j:5.12.0
    container_name: veille_neo4j
    environment:
      NEO4J_AUTH: neo4j/veille_graph
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j-admin", "database", "check", "system"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    container_name: veille_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
